<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>valehelle</title>
<meta name="description" content="Where I host my projects.">
<style>
  :root { --bg: #f6f6f3; --fg: #1c1c1a; --muted: #6b6b66; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121211; --fg: #ededea; --muted: #8f8f89; } }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 0 16px;
    background: var(--bg); color: var(--fg);
    font: 17px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 32rem; }
  h1 { margin: 0 0 .25rem; font-size: 2rem; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>valehelle</h1>
  <p>A place where I host all my projects.</p>
</main>
</body>
</html>
